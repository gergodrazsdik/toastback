name: Feature request
description: An idea for something toastback could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some things are Windows limitations rather than missing features (for example, there's no callback
        when a toast is dismissed). The README's
        [Limitations](https://github.com/gergodrazsdik/toastback#limitations) section lists them.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation or workflow, and where toastback falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. A sketch of the spec or the command line helps.
      placeholder: |
        {
          "title": "...",
          "new_field": "..."
        }
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or other tools you've used, if any.
