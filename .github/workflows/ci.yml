name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR cancels its run in progress. Other runs get a group per commit: in a shared
# group GitHub would also cancel a pending run when the next one queues, leaving a main commit untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  CARGO_XWIN_VERSION: 0.23.1

jobs:
  build:
    name: Build (Linux, cargo-xwin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: clang, lld, llvm
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy clang lld llvm
          # embed-resource and cargo-xwin want the unversioned names
          for tool in llvm-rc lld-link; do
            if ! command -v "$tool" >/dev/null; then
              sudo ln -s "$(printf '%s\n' /usr/bin/"$tool"-* | sort -V | tail -1)" "/usr/local/bin/$tool"
            fi
          done
          llvm-rc --version | head -1

      - name: cargo-xwin (prebuilt wheel)
        run: pipx install "cargo-xwin==$CARGO_XWIN_VERSION"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the MSVC CRT and Windows SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo xwin clippy --release --target "$TARGET" --all-targets -- -D warnings

      - name: Host tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo xwin build --release --target "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toastback-exe
          path: |
            target/x86_64-pc-windows-msvc/release/toastback.exe
            target/x86_64-pc-windows-msvc/release/toastback-cli.exe
          if-no-files-found: error

  test:
    name: Test (Windows, native)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # showing toasts and dialogs stays out of CI; the unit tests don't need a desktop
      - run: cargo test

  smoke:
    name: Smoke test the cross-built exe (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toastback-exe
          path: dist
      - name: version, validate, install, doctor, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tb = Join-Path $PWD 'dist\toastback-cli.exe'
          function Invoke-Toastback {
            & $tb @args
            if ($LASTEXITCODE) { throw "toastback $args exited with $LASTEXITCODE" }
          }

          Invoke-Toastback --version
          Invoke-Toastback validate (Get-ChildItem examples\*.json | ForEach-Object { "examples\$($_.Name)" })
          Invoke-Toastback examples
          # the embedded copy is a valid spec too
          & $tb examples deploy | & $tb validate -
          if ($LASTEXITCODE) { throw "the built-in deploy example doesn't validate" }

          # the "installed" test toast may fail on a runner without a desktop: install only warns then
          Invoke-Toastback install --wsl none

          $checks = & $tb doctor --json | ConvertFrom-Json
          $checks | Format-Table -AutoSize
          # notifications may be unavailable in a CI session: a warning here, not a failure
          $failed = $checks | Where-Object { $_.status -eq 'fail' -and $_.name -ne 'notifications' }
          if ($failed) { throw "doctor failed: $($failed.name -join ', ')" }

          # what winget reads to see the version and to uninstall
          $appKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Toastback'
          $app = Get-ItemProperty $appKey
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if ($app.DisplayVersion -ne $version) { throw "app entry version: $($app.DisplayVersion), not $version" }
          if (-not $app.QuietUninstallString) { throw 'app entry: no QuietUninstallString' }

          Invoke-Toastback uninstall --purge
          foreach ($key in 'HKCU:\Software\Classes\toastback',
                           'HKCU:\Software\Classes\AppUserModelId\Toastback',
                           $appKey) {
            if (Test-Path $key) { throw "left behind: $key" }
          }
          if (Test-Path "$env:LOCALAPPDATA\toastback") { throw "left behind: $env:LOCALAPPDATA\toastback" }
          'smoke test passed'
