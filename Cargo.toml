[package]
name = "toastback"
version = "1.0.0"
edition = "2024"
description = "async Windows toasts with callbacks, for WSL and scripts"
license = "GPL-3.0-or-later"
repository = "https://github.com/gergodrazsdik/toastback"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
embed-resource = "3.0.12"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Environment", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_Registry", "UI_Notifications", "Data_Xml_Dom", "Win32_System_JobObjects"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
