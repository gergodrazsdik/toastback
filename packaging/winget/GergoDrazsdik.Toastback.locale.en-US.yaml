ShortDescription: Async Windows toast notifications with callbacks, for WSL and scripts.
Description: |-
  toastback shows a toast or a native dialog and returns immediately. When someone clicks a button, even hours later
  from the notification center, Windows starts toastback again and it runs the command attached to that button, in
  WSL or on Windows. From WSL, use the toastback command; from cmd and PowerShell, use toastback-cli.
